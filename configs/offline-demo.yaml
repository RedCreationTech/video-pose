manifest: ../fixtures/replay/session-manifest.yaml
rules: ../fixtures/rules/pick-place.yaml
calibration: ../fixtures/calibration/planar-demo.yaml
zones: ../fixtures/zones/pick-place-front.yaml

detector:
  weights: ../models/weights/tools-best.pt
  confidence: 0.40
  person_confidence: 0.50
  object_confidence: 0.40
  device: cuda:0
  allowed_classes:
    - person
    - component_A
    - torque_wrench
    - open_end_wrench

pose:
  enabled: true
  config: ../configs/rtmpose-body.py
  checkpoint: ../models/weights/rtmpose-body.pth
  device: cuda:0

relation:
  hold_frames: 2
  free_frames: 2
  hold_ratio: 0.20
  near_ratio: 0.75
  min_hold_px: 18
  min_near_px: 60

identity:
  enabled: true
  distance_threshold: 120
  max_missed: 10

triangulation:
  enabled: false
  calibration: ../fixtures/calibration/perspective-demo.yaml
  max_reprojection_rmse: 5.0

actions:
  tool_classes:
    - torque_wrench
  operation_zones:
    - assembly_zone
  tool_min_path_length: 40
  enable_zone_transitions: false
  zone_entity_classes:
    - person

action_min_confidence: 0.75
