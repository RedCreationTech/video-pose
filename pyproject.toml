[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "video-pose"
version = "0.26.0"
description = "Multi-view action compliance detection core for Video Pose"
readme = {file = "README.org", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "SQLAlchemy>=2.0.54,<2.1",
  "alembic>=1.20,<2",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
]
db = [
  "SQLAlchemy>=2.0.54,<2.1",
  "alembic>=1.20,<2",
  "psycopg[binary]>=3.2,<4",
]
video = [
  "opencv-python-headless>=4.10,<5",
]
yolo = [
  "ultralytics>=8.3",
]
mmpose = [
  "mmpose>=1.3,<2",
  "mmengine>=0.10,<1",
]

[project.scripts]
video-pose-replay = "video_pose.cli:main"
video-pose-analyze = "video_pose.analyze_cli:main"
video-pose-live = "video_pose.live_cli:main"
video-pose-serve = "video_pose.live_service_cli:main"
video-pose-soak = "video_pose.soak_cli:main"
video-pose-managed-soak = "video_pose.managed_soak_cli:main"
video-pose-doctor = "video_pose.doctor_cli:main"
video-pose-calibrate = "video_pose.calibration_cli:main"
video-pose-evaluate = "video_pose.evaluate_cli:main"
video-pose-camera-model = "video_pose.camera_model_cli:main"
video-pose-calibration-health = "video_pose.calibration_health_cli:main"
video-pose-db = "video_pose.db_cli:main"
video-pose-reindex = "video_pose.reindex_cli:main"
video-pose-auth-hash = "video_pose.auth_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_pose"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/video_pose/live_service.py" = ["B008"]
