name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Replay smoke test
        run: |
          video-pose-replay \
            --events fixtures/replay/compliant.jsonl \
            --rules fixtures/rules/assembly-a.yaml
      - name: Fault scenario smoke test
        run: |
          video-pose-fault-evaluate \
            --scenario fixtures/faults/camera-outage.yaml \
            --scenario fixtures/faults/sync-stall.yaml \
            --scenario fixtures/faults/sync-drift.yaml \
            --scenario fixtures/faults/processing-error.yaml \
            --scenario fixtures/faults/processing-drop.yaml \
            --scenario fixtures/faults/evidence-pressure.yaml \
            --scenario fixtures/faults/audit-write-failure.yaml
