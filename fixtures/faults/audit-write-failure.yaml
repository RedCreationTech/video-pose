scenario_id: audit-write-failure
session_id: fault-audit
rules: ../rules/pick-place.yaml
camera_ids: []

quality:
  enabled: true
  monitor_cameras: false
  monitor_sync: false
  monitor_processing: false
  monitor_evidence: false
  monitor_audit: true
  audit_grace_ms: 0
  max_audit_error_delta: 0
