services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_pose
      POSTGRES_USER: video_pose
      POSTGRES_PASSWORD: video_pose_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_pose"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: video_pose
      MINIO_ROOT_PASSWORD: video_pose_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
