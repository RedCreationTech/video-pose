manifest: /etc/video-pose/session-manifest.yaml
rules: /etc/video-pose/rules.yaml
calibration: /etc/video-pose/planar-calibration.yaml
zones: /etc/video-pose/zones.yaml

detector:
  weights: /opt/video-pose/models/tools-best.pt
  confidence: 0.40
  person_confidence: 0.50
  object_confidence: 0.40
  device: cuda:0

pose:
  enabled: true
  config: /etc/video-pose/rtmpose-body.py
  checkpoint: /opt/video-pose/models/rtmpose-body.pth
  device: cuda:0

identity:
  enabled: true
  distance_threshold: 120
  max_missed: 10

live:
  backend: gstreamer-native
  rtsp_transport: tcp
  latency_ms: 100
  appsink_max_buffers: 1
  appsink_drop: true
  appsink_sync: false
  native_timestamp_source: pts
  native_pull_timeout_ms: 1000

evidence:
  enabled: true
  root: /var/lib/video-pose/evidence
  pre_roll_ms: 3000
  post_roll_ms: 3000
  sample_interval_ms: 200
  jpeg_quality: 70
  worker_queue_size: 2
  retention_days: 180
  max_total_gb: 50
  protect_unreviewed: true
  cleanup_interval_s: 3600

action_min_confidence: 0.75


readiness:
  enabled: true
  require_all_cameras_online: true
  allow_camera_degraded: false
  require_sync: true
  min_sync_emitted_total: 30
  max_sync_miss_ratio: 0.20
  max_sync_p99_skew_ms: 20
  max_abs_sync_drift_ms_per_minute: 2.0
  block_evidence_over_capacity: true
  block_evidence_errors: true
  require_persistence: true
  block_persistence_degraded: true
  block_audit_degraded: true
  require_runtime_assets: true
  require_storage_headroom: true
  min_storage_free_ratio: 0.10
  min_storage_free_gb: 5


# Enable after the site provides independent validation control points.
calibration_health:
  enabled: false
  calibration: /etc/video-pose/perspective-calibration.yaml
  control_points: /etc/video-pose/calibration-control-points.yaml
  max_rmse: 5.0


session_quality:
  enabled: true
  monitor_cameras: true
  monitor_sync: true
  poll_interval_ms: 500
  camera_grace_ms: 3000
  max_camera_staleness_ms: 3000
  sync_grace_ms: 3000
  max_sync_miss_ratio: 0.30
  max_sync_p99_skew_ms: 30
  max_abs_sync_drift_ms_per_minute: 3.0
  monitor_processing: true
  processing_grace_ms: 3000
  max_processing_error_delta: 0
  max_processing_drop_ratio: 0.20
  monitor_evidence: true
  evidence_grace_ms: 3000
  max_evidence_error_delta: 0
  max_evidence_drop_ratio: 0.30
  block_evidence_over_capacity: true
  monitor_audit: true
  audit_grace_ms: 0
  max_audit_error_delta: 0
  severity: CRITICAL
